<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PrimeVest Africa - Login</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #050b1f, #111d4a, #00b894);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      padding: 40px 25px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      animation: fadeIn 0.6s ease;
      text-align: center;
    }

    @keyframes fadeIn {
      from {
        opacity:0;
        transform:translateY(30px);
      }

      to {
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo h3 {
      margin:0;
      color:#0b7a5a;
      font-size:26px;
      font-weight:800;
      letter-spacing:1px;
    }

    h2 {
      margin:18px 0 10px;
      font-size:24px;
      color:#111;
    }

    p {
      color:#666;
      font-size:14px;
      margin-bottom:25px;
    }

    .form-group {
      margin-bottom:16px;
      position:relative;
      text-align:left;
    }

    .form-group input {
      width:100%;
      padding:14px 15px;
      border-radius:15px;
      border:1px solid #ddd;
      background:#f8f9fc;
      font-size:14px;
      outline:none;
      transition:.3s;
    }

    .form-group input:focus {
      background:white;
      border-color:#00b894;
      box-shadow:0 0 0 3px rgba(0,184,148,.15);
    }

    .toggle-password {
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      color:#00b894;
      font-size:13px;
      font-weight:600;
      cursor:pointer;
    }

    .login-btn {
      width:100%;
      margin-top:10px;
      padding:14px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,#00b894,#00cec9);
      color:white;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 10px 25px rgba(0,184,148,.3);
      transition:.3s;
    }

    .login-btn:hover {
      transform:translateY(-3px);
    }

    .login-btn:disabled {
      opacity:.7;
      cursor:not-allowed;
      transform:none;
    }

    .signup-text {
      margin-top:22px;
      font-size:14px;
      color:#555;
    }

    .signup-text a {
      color:#00b894;
      font-weight:700;
      text-decoration:none;
    }

    .footer-note {
      margin-top:20px;
      font-size:12px;
      color:#777;
    }


    /* =========================
       APP NOTIFICATION
    ========================= */

    #appNotification {
      position:fixed;
      top:20px;
      left:50%;

      transform:translate(-50%, -140px);

      width:calc(100% - 30px);
      max-width:390px;

      padding:14px 16px;

      border-radius:17px;

      display:flex;
      align-items:center;
      gap:12px;

      color:white;

      z-index:99999;

      opacity:0;
      pointer-events:none;

      box-shadow:0 14px 35px rgba(0,0,0,.22);

      transition:
        transform .4s cubic-bezier(.4,0,.2,1),
        opacity .4s ease;
    }

    #appNotification.show {
      opacity:1;
      transform:translate(-50%, 0);
    }

    .notification-icon {
      width:36px;
      height:36px;
      min-width:36px;

      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:rgba(255,255,255,.18);

      font-size:18px;
      font-weight:800;
    }

    .notification-content {
      flex:1;
      min-width:0;
    }

    .notification-title {
      font-size:14px;
      font-weight:800;
      margin-bottom:3px;
    }

    .notification-message {
      font-size:12px;
      font-weight:500;
      line-height:1.4;
      opacity:.95;
    }

    .notification-close {
      font-size:20px;
      cursor:pointer;
      opacity:.8;
      padding:3px;
      user-select:none;
    }

    .notification-close:hover {
      opacity:1;
    }

    .success {
      background:linear-gradient(135deg,#00b894,#009f7f);
    }

    .error {
      background:linear-gradient(135deg,#e74c3c,#c0392b);
    }

    .warning {
      background:linear-gradient(135deg,#f39c12,#e67e22);
    }

    .info {
      background:linear-gradient(135deg,#0984e3,#0652dd);
    }


    @media (max-width:480px) {

      #appNotification {
        top:12px;
        width:calc(100% - 24px);
      }

      .container {
        margin:15px;
      }

    }

  </style>
</head>


<body>


<!-- =========================
     APP NOTIFICATION
========================= -->

<div id="appNotification">

  <div
    class="notification-icon"
    id="notificationIcon"
  >
    ✓
  </div>

  <div class="notification-content">

    <div
      class="notification-title"
      id="notificationTitle"
    >
      Notification
    </div>

    <div
      class="notification-message"
      id="notificationMessage"
    >
      Message
    </div>

  </div>

  <div
    class="notification-close"
    onclick="hideNotification()"
  >
    ×
  </div>

</div>


<div class="container">

  <div class="logo">
    <h3>PV AFRICA LTD</h3>
  </div>


  <h2>INJIRA MURI KONTI</h2>

  <p>
    Muhawe ikaze! Injira muri konti yawe utangire winjize.
  </p>


  <form id="loginForm">

    <div class="form-group">

      <input
        type="email"
        id="email"
        placeholder="EMAIL YAWE"
        required
      >

    </div>


    <div class="form-group">

      <input
        type="password"
        id="password"
        placeholder="IJAMBO BANGA"
        required
      >

      <span
        class="toggle-password"
        onclick="togglePassword()"
      >
        Erekana
      </span>

    </div>


    <button
      type="submit"
      class="login-btn"
      id="loginBtn"
    >
      INJIRA MURI KONTI
    </button>

  </form>


  <div class="signup-text">

    Udafite konti?

    <a href="index.html">
      IYANDIKISHE
    </a>

  </div>


  <div class="footer-note">
    🔒 Amakuru ya konti ararinzwe
  </div>

</div>


<script type="module">


/* =========================
   FIREBASE IMPORTS
========================= */

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBXV-MbphBrh20w-YYZgBBDuQ976XwLbq8",

  authDomain:
    "onafriq-5256f.firebaseapp.com",

  databaseURL:
    "https://onafriq-5256f-default-rtdb.firebaseio.com",

  projectId:
    "onafriq-5256f",

  storageBucket:
    "onafriq-5256f.firebasestorage.app",

  messagingSenderId:
    "513083205642",

  appId:
    "1:513083205642:web:532ef673dfb4a2c3f0d7f3"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


/* =========================
   NOTIFICATION SYSTEM
========================= */

let notificationTimer;


window.showNotification = (
  message,
  type = "info",
  title = null
) => {

  const notification =
    document.getElementById(
      "appNotification"
    );

  const icon =
    document.getElementById(
      "notificationIcon"
    );

  const titleElement =
    document.getElementById(
      "notificationTitle"
    );

  const messageElement =
    document.getElementById(
      "notificationMessage"
    );


  clearTimeout(notificationTimer);


  /* Remove previous classes */

  notification.className = "";


  /* Add notification type */

  notification.classList.add(type);


  /* Icons */

  const icons = {

    success: "✓",

    error: "✕",

    warning: "!",

    info: "i"

  };


  icon.textContent =
    icons[type] || "i";


  /* Titles */

  const titles = {

    success: "Byagenze neza",

    error: "Hari ikibazo",

    warning: "Icyitonderwa",

    info: "Amakuru"

  };


  titleElement.textContent =
    title ||
    titles[type] ||
    "Notification";


  messageElement.textContent =
    message;


  /* Show */

  requestAnimationFrame(() => {

    notification.classList.add(
      "show"
    );

  });


  /* Hide automatically */

  notificationTimer =
    setTimeout(() => {

      hideNotification();

    }, 4000);

};


window.hideNotification = () => {

  const notification =
    document.getElementById(
      "appNotification"
    );

  notification.classList.remove(
    "show"
  );

};


/* =========================
   ELEMENTS
========================= */

const loginForm =
  document.getElementById(
    "loginForm"
  );


const loginBtn =
  document.getElementById(
    "loginBtn"
  );


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
  "submit",
  async (e) => {

    e.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    /* =========================
       BASIC VALIDATION
    ========================= */

    if (!email || !password) {

      showNotification(
        "Banza wandike email n'ijambo banga.",
        "warning"
      );

      return;

    }


    /* =========================
       LOADING
    ========================= */

    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "KWINJIRA...";


    try {


      /* =========================
         SAVE LOGIN SESSION
      ========================= */

      await setPersistence(
        auth,
        browserLocalPersistence
      );


      /* =========================
         LOGIN
      ========================= */

      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      console.log(
        "LOGIN SUCCESS"
      );


      console.log(
        "USER UID:",
        result.user.uid
      );


      console.log(
        "USER EMAIL:",
        result.user.email
      );


      /* =========================
         SUCCESS NOTIFICATION
      ========================= */

      showNotification(
        "Winjiye neza. Tegereza gato...",
        "success",
        "Murakaza neza!"
      );


      /* =========================
         GO TO DASHBOARD
      ========================= */

      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 1000);


    } catch (error) {

      console.error(
        "LOGIN ERROR:",
        error
      );


      let message =
        "Email cyangwa ijambo banga ntabwo ari byo.";


      /* Firebase error messages */

      if (
        error.code ===
        "auth/invalid-credential"
      ) {

        message =
          "Email cyangwa ijambo banga ntabwo ari byo.";

      }

      else if (
        error.code ===
        "auth/user-not-found"
      ) {

        message =
          "Nta konti ibonetse kuri iyi email.";

      }

      else if (
        error.code ===
        "auth/wrong-password"
      ) {

        message =
          "Ijambo banga ntabwo ari ryo.";

      }

      else if (
        error.code ===
        "auth/invalid-email"
      ) {

        message =
          "Andika email iboneye.";

      }

      else if (
        error.code ===
        "auth/too-many-requests"
      ) {

        message =
          "Gerageza nyuma gato. Hari attempts nyinshi.";

      }

      else if (
        error.code ===
        "auth/network-request-failed"
      ) {

        message =
          "Internet ntabwo iri gukora neza.";

      }


      showNotification(
        message,
        "error",
        "Kwinjira byanze"
      );


      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "INJIRA MURI KONTI";

    }

  }
);


/* =========================
   SHOW / HIDE PASSWORD
========================= */

window.togglePassword =
  function() {

    const input =
      document.getElementById(
        "password"
      );


    const toggle =
      document.querySelector(
        ".toggle-password"
      );


    if (
      input.type === "password"
    ) {

      input.type =
        "text";

      toggle.textContent =
        "Hisha";

    }

    else {

      input.type =
        "password";

      toggle.textContent =
        "Erekana";

    }

  };


</script>


</body>
</html>
