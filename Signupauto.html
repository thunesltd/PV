<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- =========================
     SOCIAL MEDIA PREVIEW
========================= -->

<meta property="og:type" content="website">

<meta property="og:title"
      content="PrimeVest Africa - Sign Up">

<meta property="og:description"
      content="PrimeVest Africa - Fungura konti yawe utangire gukoresha serivisi zacu.">

<meta property="og:image"
      content="https://pvafrica.vercel.app/logo.png">

<meta property="og:image:width"
      content="1200">

<meta property="og:image:height"
      content="630">

<meta property="og:url"
      content="https://pvafrica.vercel.app">

<meta property="og:site_name"
      content="PrimeVest Africa">


<!-- WhatsApp / Facebook / Telegram -->
<meta name="twitter:card"
      content="summary_large_image">

<meta name="twitter:title"
      content="PrimeVest Africa - Sign Up">

<meta name="twitter:description"
      content="PrimeVest Africa - Fungura konti yawe utangire gukoresha serivisi zacu.">

<meta name="twitter:image"
      content="https://pvafrica.vercel.app/logo.png">


<title>PrimeVest Africa - Sign Up</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  background:linear-gradient(135deg,#050b1f,#111d4a,#00b894);
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(15px);
  border-radius:28px;
  padding:35px 25px;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
  animation:fadeIn .6s ease;
}

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(30px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.logo h3{
  margin:0;
  color:#0b7a5a;
  font-size:24px;
  font-weight:800;
  letter-spacing:1px;
}

h2{
  margin:18px 0 10px;
  font-size:23px;
  color:#111;
}

.bonus{
  background:linear-gradient(135deg,#ffd700,#ff9800);
  color:#fff;
  padding:5px 12px;
  font-size:12px;
  border-radius:20px;
  margin-left:8px;
}

p{
  color:#666;
  font-size:14px;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:16px;
  position:relative;
}

.form-group input{
  width:100%;
  padding:14px 15px;
  border-radius:15px;
  border:1px solid #ddd;
  background:#f8f9fc;
  font-size:14px;
  outline:none;
  transition:.3s;
}

.form-group input:focus{
  background:#fff;
  border-color:#00b894;
  box-shadow:0 0 0 3px rgba(0,184,148,.15);
}

.toggle-password{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  color:#00b894;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.confirm-section{
  margin:20px 0;
  font-size:14px;
  color:#444;
}

.confirm-section input{
  accent-color:#00b894;
}

.create-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#00b894,#00cec9);
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,184,148,.3);
  transition:.3s;
}

.create-btn:hover:enabled{
  transform:translateY(-3px);
}

.create-btn:disabled{
  background:#b7ddd6;
  box-shadow:none;
  cursor:not-allowed;
}

.login-text{
  margin-top:22px;
  text-align:center;
  font-size:14px;
}

.login-text a{
  color:#00b894;
  font-weight:700;
  text-decoration:none;
}

.footer-note{
  margin-top:20px;
  text-align:center;
  color:#777;
  font-size:12px;
}

small{
  color:red;
  font-size:12px;
  display:none;
  margin-top:5px;
}


/* =========================
   APP NOTIFICATION
========================= */

#appNotification{

  position:fixed;
  top:20px;
  left:50%;

  transform:translate(-50%,-140px);

  width:calc(100% - 30px);
  max-width:390px;

  padding:14px 16px;

  border-radius:17px;

  display:flex;
  align-items:center;
  gap:12px;

  color:white;

  z-index:99999;

  opacity:0;
  pointer-events:none;

  box-shadow:0 14px 35px rgba(0,0,0,.22);

  transition:
    transform .4s cubic-bezier(.4,0,.2,1),
    opacity .4s ease;
}

#appNotification.show{

  opacity:1;

  transform:
    translate(-50%,0);

}

.notification-icon{

  width:36px;
  height:36px;
  min-width:36px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.18);

  font-size:18px;
  font-weight:800;
}

.notification-content{
  flex:1;
  min-width:0;
}

.notification-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:3px;
}

.notification-message{
  font-size:12px;
  font-weight:500;
  line-height:1.4;
  opacity:.95;
}

.notification-close{
  font-size:20px;
  cursor:pointer;
  opacity:.8;
  padding:3px;
  user-select:none;
}

#appNotification.success{
  background:linear-gradient(135deg,#00b894,#009f7f);
}

#appNotification.error{
  background:linear-gradient(135deg,#e74c3c,#c0392b);
}

#appNotification.warning{
  background:linear-gradient(135deg,#f39c12,#e67e22);
}

#appNotification.info{
  background:linear-gradient(135deg,#0984e3,#0652dd);
}


/* =========================
   LOADING OVERLAY
========================= */

#pageLoader{

  position:fixed;

  inset:0;

  background:
    linear-gradient(
      135deg,
      #050b1f,
      #111d4a,
      #00b894
    );

  display:flex;

  align-items:center;
  justify-content:center;

  z-index:100000;

  transition:opacity .3s ease;

}

.loaderBox{

  text-align:center;

  color:white;

}

.loaderSpinner{

  width:45px;
  height:45px;

  border:4px solid rgba(255,255,255,.25);

  border-top-color:white;

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin:auto auto 15px;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.loaderBox p{

  color:white;

  margin:0;

  font-size:14px;

  font-weight:600;

}


@media(max-width:480px){

  #appNotification{

    top:12px;

    width:calc(100% - 24px);

  }

  .container{

    margin:15px;

  }

}

</style>

</head>


<body>


<!-- =========================
     PAGE LOADER
========================= -->

<div id="pageLoader">

  <div class="loaderBox">

    <div class="loaderSpinner"></div>

    <p>Turimo kugenzura konti...</p>

  </div>

</div>


<!-- =========================
     APP NOTIFICATION
========================= -->

<div id="appNotification">

  <div
    class="notification-icon"
    id="notificationIcon"
  >
    ✓
  </div>


  <div class="notification-content">

    <div
      class="notification-title"
      id="notificationTitle"
    >
      Notification
    </div>


    <div
      class="notification-message"
      id="notificationMessage"
    >
      Message
    </div>

  </div>


  <div
    class="notification-close"
    onclick="hideNotification()"
  >
    ×
  </div>

</div>


<!-- =========================
     SIGN UP
========================= -->

<div class="container">

  <div class="logo">

    <h3>
      PV AFRICA LTD
    </h3>

  </div>


  <h2>

    FUNGURA KONTI

    <span class="bonus">
      RWF 1,320 Y'IKAZE
    </span>

  </h2>


  <p>

    Fungura konti utangire winjize
    amafaranga nonaha.

  </p>


  <form id="signupForm">


    <div class="form-group">

      <input
        type="text"
        id="fullName"
        placeholder="IZINA RYA MBERE"
        required
      >

    </div>


    <div class="form-group">

      <input
        type="text"
        id="username"
        placeholder="IZINA RYA KONTI"
        required
      >

    </div>


    <div class="form-group">

      <input
        type="tel"
        id="phoneNumber"
        placeholder="NIMERO YA TELEPHONE"
        required
      >

    </div>


    <div class="form-group">

      <input
        type="email"
        id="email"
        placeholder="EMAIL YAWE"
        required
      >

    </div>


    <div class="form-group">

      <input
        type="password"
        id="password"
        placeholder="IJAMBO BANGA"
        required
      >

      <span
        class="toggle-password"
        onclick="togglePassword('password')"
      >
        Erekana
      </span>

    </div>


    <div class="form-group">

      <input
        type="password"
        id="confirmPassword"
        placeholder="EMEZA IJAMBO BANGA"
        required
      >

      <span
        class="toggle-password"
        onclick="togglePassword('confirmPassword')"
      >
        Erekana
      </span>


      <small id="passwordError">

        IJAMBO BANGA NTAGO RIHURA.

      </small>

    </div>


    <div class="confirm-section">

      <label>

        <input
          type="checkbox"
          id="confirmCheckbox"
        >

        Kwemeza kwiyandikisha

      </label>

    </div>

  </form>


  <button
    id="okBtn"
    class="create-btn"
    disabled
  >

    FUNGURA KONTI

  </button>


  <div class="login-text">

    Nsanzwe mfite konti?

    <a href="Login.html">

      Injira

    </a>

  </div>


  <div class="footer-note">

    🔒 Imyirondoro yawe irarinzwe

  </div>

</div>


<script type="module">


/* =========================
   FIREBASE IMPORTS
========================= */

import {

  initializeApp

}
from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {

  getAuth,

  createUserWithEmailAndPassword,

  setPersistence,

  browserLocalPersistence,

  onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


import {

  getDatabase,

  ref,

  set,

  get

}
from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBXV-MbphBrh20w-YYZgBBDuQ976XwLbq8",

  authDomain:
    "onafriq-5256f.firebaseapp.com",

  databaseURL:
    "https://onafriq-5256f-default-rtdb.firebaseio.com",

  projectId:
    "onafriq-5256f",

  storageBucket:
    "onafriq-5256f.firebasestorage.app",

  messagingSenderId:
    "513083205642",

  appId:
    "1:513083205642:web:532ef673dfb4a2c3f0d7f3"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getDatabase(app);


/* =========================
   PERSISTENT LOGIN
========================= */

await setPersistence(
  auth,
  browserLocalPersistence
);


/* =========================
   CHECK EXISTING USER
========================= */

onAuthStateChanged(
  auth,
  (user) => {

    if (user) {

      /*
        IMPORTANT:

        If the person is already logged in,
        don't show the registration page.

        Send directly to dashboard.
      */

      window.location.replace(
        "dashboard.html"
      );

      return;

    }


    /*
      No user logged in.

      Show registration page.
    */

    const loader =
      document.getElementById(
        "pageLoader"
      );

    loader.style.opacity =
      "0";


    setTimeout(() => {

      loader.style.display =
        "none";

    }, 300);

  }
);


/* =========================
   NOTIFICATION SYSTEM
========================= */

let notificationTimer;


window.showNotification =
(
  message,
  type = "info",
  title = null
) => {


  const notification =
    document.getElementById(
      "appNotification"
    );


  const icon =
    document.getElementById(
      "notificationIcon"
    );


  const titleElement =
    document.getElementById(
      "notificationTitle"
    );


  const messageElement =
    document.getElementById(
      "notificationMessage"
    );


  clearTimeout(
    notificationTimer
  );


  notification.className =
    "";


  notification.classList.add(
    type
  );


  const icons = {

    success:"✓",

    error:"✕",

    warning:"!",

    info:"i"

  };


  icon.textContent =
    icons[type] || "i";


  const titles = {

    success:"Byagenze neza",

    error:"Hari ikibazo",

    warning:"Icyitonderwa",

    info:"Amakuru"

  };


  titleElement.textContent =
    title ||
    titles[type] ||
    "Notification";


  messageElement.textContent =
    message;


  requestAnimationFrame(() => {

    notification.classList.add(
      "show"
    );

  });


  notificationTimer =
    setTimeout(() => {

      hideNotification();

    },4000);

};


window.hideNotification =
() => {

  const notification =
    document.getElementById(
      "appNotification"
    );


  notification.classList.remove(
    "show"
  );

};


/* =========================
   REFERRAL CODE
========================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const inviterUsername =
  (
    urlParams.get("ref") || ""
  ).trim();


console.log(
  "Referral:",
  inviterUsername ||
  "No referral"
);


/* =========================
   ELEMENTS
========================= */

const signupForm =
  document.getElementById(
    "signupForm"
  );


const checkbox =
  document.getElementById(
    "confirmCheckbox"
  );


const okBtn =
  document.getElementById(
    "okBtn"
  );


const passwordError =
  document.getElementById(
    "passwordError"
  );


/* =========================
   SIGN UP BUTTON
========================= */

checkbox.addEventListener(
  "change",
  async (e) => {


    if (!e.target.checked)
      return;


    const fullName =
      document
        .getElementById("fullName")
        .value
        .trim();


    const username =
      document
        .getElementById("username")
        .value
        .trim();


    const phone =
      document
        .getElementById("phoneNumber")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const pass =
      document
        .getElementById("password")
        .value;


    const confirm =
      document
        .getElementById("confirmPassword")
        .value;


    /* =========================
       VALIDATION
    ========================= */

    if(
      !fullName ||
      !username ||
      !phone ||
      !email ||
      !pass ||
      !confirm
    ){

      showNotification(
        "Banza wuzuze imyirondoro yawe.",
        "warning"
      );


      e.target.checked =
        false;


      return;

    }


    if(pass !== confirm){

      passwordError.style.display =
        "block";


      showNotification(
        "Amagambo banga ntiyahuye. Ongera ugenzure.",
        "error"
      );


      e.target.checked =
        false;


      return;

    }


    passwordError.style.display =
      "none";


    /* =========================
       DISABLE WHILE PROCESSING
    ========================= */

    checkbox.disabled =
      true;


    okBtn.disabled =
      true;


    okBtn.textContent =
      "KUREMA KONTI...";


    try{


      /* =========================
         CHECK USERNAME
      ========================= */

      const usersSnapshot =
        await get(
          ref(db,"users")
        );


      let usernameExists =
        false;


      if(usersSnapshot.exists()){

        usersSnapshot.forEach(
          (user) => {

            const userData =
              user.val();


            if(
              userData.username &&
              userData.username
                .toLowerCase() ===
              username.toLowerCase()
            ){

              usernameExists =
                true;

            }

          }
        );

      }


      if(usernameExists){

        showNotification(
          "Iri zina rya konti rirakoreshwa n'undi muntu. Hitamo irindi.",
          "error"
        );


        checkbox.disabled =
          false;


        checkbox.checked =
          false;


        okBtn.textContent =
          "FUNGURA KONTI";


        return;

      }


      /* =========================
         CHECK REFERRER
      ========================= */

      let validInviterUsername =
        "";


      if(inviterUsername){

        let inviterFound =
          false;


        if(usersSnapshot.exists()){

          usersSnapshot.forEach(
            (user) => {

              const userData =
                user.val();


              if(
                userData.username &&
                userData.username
                  .toLowerCase() ===
                inviterUsername.toLowerCase()
              ){

                inviterFound =
                  true;


                validInviterUsername =
                  userData.username;

              }

            }
          );

        }


        if(inviterFound){

          validInviterUsername =
            validInviterUsername;

        }

        else{

          showNotification(
            "Referral link ntabwo ari valid. Konti irakomeza gufunguka nta referral.",
            "warning"
          );


          validInviterUsername =
            "";

        }

      }


      /* =========================
         CREATE FIREBASE ACCOUNT
      ========================= */

      const cred =
        await createUserWithEmailAndPassword(
          auth,
          email,
          pass
        );


      /* =========================
         CREATE DATABASE PROFILE
      ========================= */

      await set(

        ref(
          db,
          "users/" +
          cred.user.uid
        ),

        {

          uid:
            cred.user.uid,

          name:
            fullName,

          username:
            username,

          phone:
            phone,

          email:
            email,


          /* BALANCE */

          balance:
            1320,

          welcomeBonus:
            1320,

          totalEarned:
            1320,


          /* INVESTMENT */

          deposit:
            0,


          /* WITHDRAWALS */

          withdrawn:
            0,

          pendingWithdraw:
            0,


          /* REFERRALS */

          referrals:
            0,

          referralBonus:
            0,

          inviterUsername:
            validInviterUsername,


          /* ACCOUNT */

          active:
            false,


          createdAt:
            Date.now()

        }

      );


      /* =========================
         ACCOUNT CREATED
      ========================= */

      showNotification(
        "Konti yawe yafunguwe neza. Turakujyana kuri Dashboard...",
        "success",
        "Konti yafunguwe!"
      );


      /*
        IMPORTANT:

        createUserWithEmailAndPassword()
        has already logged the user in.

        Therefore:
        NO LOGIN PAGE.

        Go directly to dashboard.
      */

      setTimeout(() => {

        window.location.replace(
          "dashboard.html"
        );

      },800);


    }

    catch(err){

      console.error(
        "SIGNUP ERROR:",
        err
      );


      let message =
        "Ntibyashobotse gufungura konti.";


      /* =========================
         FIREBASE ERRORS
      ========================= */

      if(
        err.code ===
        "auth/email-already-in-use"
      ){

        message =
          "Iyi email isanzwe ifite konti. Injira aho kongera kwiyandikisha.";

      }

      else if(
        err.code ===
        "auth/invalid-email"
      ){

        message =
          "Andika email iboneye.";

      }

      else if(
        err.code ===
        "auth/weak-password"
      ){

        message =
          "Ijambo banga rigomba kuba rifite nibura inyuguti 6.";

      }

      else if(
        err.code ===
        "auth/network-request-failed"
      ){

        message =
          "Internet ntabwo iri gukora neza.";

      }


      showNotification(
        message,
        "error",
        "Kwiyandikisha byanze"
      );


      checkbox.disabled =
        false;


      checkbox.checked =
        false;


      okBtn.disabled =
        true;


      okBtn.textContent =
        "FUNGURA KONTI";

    }

  }
);


/* =========================
   PASSWORD TOGGLE
========================= */

window.togglePassword =
(id) => {

  const input =
    document.getElementById(
      id
    );


  const toggle =
    input.parentElement
      .querySelector(
        ".toggle-password"
      );


  if(
    input.type ===
    "password"
  ){

    input.type =
      "text";


    toggle.textContent =
      "Hisha";

  }

  else{

    input.type =
      "password";


    toggle.textContent =
      "Erekana";

  }

};

</script>

</body>
</html>
